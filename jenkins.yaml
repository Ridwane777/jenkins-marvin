jenkins:
  systemMessage: "Jenkins instance configured as code (JCasC + Job DSL)."

  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
        - id: "admin"
          name: "Administrator"
          password: "${USER_ADMIN_PASSWORD}"
        - id: "maintainer"
          name: "Maintainer"
          password: "${USER_MAINTAINER_PASSWORD}"
        - id: "developer"
          name: "Developer"
          password: "${USER_DEVELOPER_PASSWORD}"
        - id: "viewer"
          name: "Viewer"
          password: "${USER_VIEWER_PASSWORD}"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Full administration"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "admin"

          - name: "maintainer"
            description: "Creates, configures and runs jobs"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Workspace"
              - "Job/Create"
              - "Job/Configure"
              - "Job/Delete"
              - "Job/Move"
              - "Job/Cancel"
            entries:
              - user: "maintainer"

          - name: "developer"
            description: "Reads and builds jobs"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Workspace"
            entries:
              - user: "developer"

          - name: "viewer"
            description: "Read-only access"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Workspace"
            entries:
              - user: "viewer"

jobs:
  - file: /usr/share/jenkins/ref/job_dsl.groovy.d/job_dsl.groovy

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false
